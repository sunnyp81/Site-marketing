name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (must finish in < 60s per ADR §6)
        run: |
          start=$SECONDS
          npm run build
          elapsed=$((SECONDS - start))
          echo "Build took ${elapsed}s"
          if [ $elapsed -gt 60 ]; then
            echo "::error::Build exceeded 60s ceiling (took ${elapsed}s)"
            exit 1
          fi

      - name: Acceptance gates (content-in-HTML, no-JS, chunk-clean, schema, RSS, reachability, bot files)
        run: npm run verify
